services:
  fuelhelper:
    image: nginx:alpine
    container_name: fuelhelper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NGINX_ENVSUBST_FILTER: ^FUEL_API_KEY$
    ports:
      - "4173:80"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./data.js:/usr/share/nginx/html/data.js:ro
    depends_on:
      fuelhelper-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fuelhelper-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fuelhelper-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FUEL_DB_PATH: /app/data/fuelhelper.db
      FUEL_SEED_PATH: /app/seed_units.json
    expose:
      - "8000"
    volumes:
      - fuelhelper_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fuelhelper_data:
