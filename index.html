<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Fuel Desk — Fleet operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand"><span class="brand-mark">FD</span><span><strong>Fuel Desk</strong><small>Operations</small></span></div>
        <p class="eyebrow sidebar-label">Main menu</p>
        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard"><span>01</span> Overview</button>
          <button class="nav-item" data-view="directory"><span>02</span> Units &amp; drivers</button>
          <button class="nav-item" data-view="operations"><span>03</span> Action board <b id="nav-alert-count">0</b></button>
          <button class="nav-item" data-view="automations"><span>04</span> Automations</button>
          <button class="nav-item" data-view="integrations"><span>05</span> Connections</button>
        </nav>
        <div class="sidebar-footer"><span class="live-dot"></span><div><strong>Personal workspace</strong><small>Changes stay in this browser</small></div></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div><p class="eyebrow">Fuel operations <span>/</span> <b id="breadcrumb">Overview</b></p><h1 id="page-title">Today’s fleet overview</h1></div>
          <div class="top-actions"><span class="sync-label"><i></i> Local data <small>Ready</small></span><button class="icon-button" id="refresh-button" aria-label="Refresh data">↻</button><div class="avatar">TO</div></div>
        </header>
        <div id="app" aria-live="polite"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
