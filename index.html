<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1017" />
    <title>Fuel Desk — Fleet operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand"><span class="brand-mark">F</span><span>Fuel Desk</span></div>
        <p class="eyebrow sidebar-label">Workspace</p>
        <nav class="nav-list">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span> Overview</button>
          <button class="nav-item" data-view="directory"><span>◫</span> Unit workspace</button>
          <button class="nav-item" data-view="operations"><span>⌁</span> Operations board <b id="nav-alert-count">0</b></button>
          <button class="nav-item" data-view="automations"><span>◌</span> Automations</button>
          <button class="nav-item" data-view="integrations"><span>↗</span> Integrations</button>
        </nav>
        <div class="sidebar-footer"><span class="live-dot"></span><div><strong>Prototype mode</strong><small>Local edits only</small></div></div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div><p class="eyebrow">Fleet operations / <span id="breadcrumb">Overview</span></p><h1 id="page-title">Good morning, operator.</h1></div>
          <div class="top-actions"><span class="sync-label"><i></i> Mock data <small>just now</small></span><button class="icon-button" id="refresh-button" aria-label="Refresh data">↻</button><div class="avatar">OP</div></div>
        </header>
        <div id="app" aria-live="polite"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
